services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: digitalstation-web:latest
    container_name: digitalstation-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/fr"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
