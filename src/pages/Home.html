<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavemesh</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  canvas#wavemesh {
    position: fixed;
    bottom: 0;
    z-index: 1;
    pointer-events: none;
    right: 0;
    width: 608px;
    height: 608px;
  }

  @media (max-width: 768px) {
    canvas#wavemesh { left: 0; right: auto; }
  }
</style>
</head>
<body>

<canvas id="wavemesh" style="position: fixed; bottom: 0px; z-index: 1; pointer-events: none; width: 608px; height: 608px;" width="608" height="608">

<script>
(function(){
  var c=document.getElementById('wavemesh');if(!c)return;
  var x=c.getContext('2d'),B=608;
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function meshDims(){
    var w=window.innerWidth;
    if (w<=480) return {rows:14,cols:56};
    if (w<=768) return {rows:18,cols:80};
    if (w<=1200) return {rows:24,cols:110};
    return {rows:30,cols:140};
  }
  var md=meshDims();
  var S={w:0,h:0,t:0,rows:md.rows,cols:md.cols,lt:0,fp:0.38,fv:0.55,bp:-0.10,bv:0.18,wa:0.10,
    stars:[],ps:null,gs:null,fc:0,rot:-40*Math.PI/180,mr:[]};
  function cl(v,a,b){return Math.max(a,Math.min(b,v))}
  function ss(e0,e1,v){var t=cl((v-e0)/(e1-e0),0,1);return t*t*(3-2*t)}
  function rz(){
    var s=Math.min(B,window.innerWidth,window.innerHeight);
    S.w=s;S.h=s;c.width=s;c.height=s;c.style.width=s+'px';c.style.height=s+'px';
    x.setTransform(1,0,0,1,0,0);
    var n=Math.floor(s*s/46000);S.stars=[];
    for(var i=0;i<n;i++){var d=i*127.1;
      S.stars.push({x:(Math.sin(d)*43758.5453%1+1)%1*s,y:(Math.sin(d*1.31)*24634.6345%1+1)%1*s,
        r:((Math.sin(d*4.17)*12345.678%1+1)%1)*0.9+0.08,a:0.015+((Math.sin(d*2.13)*6789.123%1+1)%1)*0.07});}
    var gc=document.createElement('canvas');gc.width=32;gc.height=32;var gx=gc.getContext('2d');
    var gg=gx.createRadialGradient(16,16,0,16,16,16);
    gg.addColorStop(0,'rgba(210,228,255,0.50)');gg.addColorStop(0.35,'rgba(210,228,255,0.22)');gg.addColorStop(1,'rgba(210,228,255,0)');
    gx.fillStyle=gg;gx.beginPath();gx.arc(16,16,16,0,Math.PI*2);gx.fill();S.gs=gc;
    var pc=document.createElement('canvas');pc.width=16;pc.height=16;var px=pc.getContext('2d');
    px.fillStyle='rgba(238,244,255,1)';px.beginPath();px.arc(8,8,5,0,Math.PI*2);px.fill();S.ps=pc;}
  function fs(xn){var v=cl(xn,-1,1),vx=0.72;function lr(a,b,t){return a+(b-a)*t}
    if(v<=-vx)return lr(0,-1,ss(-1,-vx,v));if(v<=0)return lr(-1,1,ss(-vx,0,v));
    if(v<=vx)return lr(1,-1,ss(0,vx,v));return lr(-1,0,ss(vx,1,v));}
  function mp(u,v,t){var xn=2*u-1,d=v,em=Math.max(0,1-Math.pow(Math.abs(xn),1.35));
    var wc=1-0.18*Math.pow(d,1),sh=fs(xn/Math.max(.001,wc)),pk=Math.max(0,sh),vl=Math.max(0,-sh);
    var pa=S.fp+(S.bp-S.fp)*d,va=S.fv+(S.bv-S.fv)*d,bs=S.bv*(1-Math.exp(-2.2*d))*0.65;
    var ph=t*1.2,we=em*(0.15+0.85*d),tw=Math.sin(xn*5.2-d*7.5+ph),sw=Math.sin(xn*2.8+d*4.8-ph*0.8);
    var wo=S.wa*we*(tw*0.7+sw*0.3),y=(-pk*pa+vl*va+pk*bs+wo)*em;
    var finalX = xn*(1.06-0.18*Math.pow(d,1.05))+0.0007*Math.sin(1.6*d+2*xn-0.35*t)*d*em;
    return{x:finalX,y:y};}
  function ds(){x.save();for(var i=0;i<S.stars.length;i++){var s=S.stars[i];
    x.beginPath();x.fillStyle='rgba(190,220,255,'+s.a+')';x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();}x.restore();}
  function dg(){var gx=S.w*1.34,gy=S.h*1.8,r=S.w*0.30;
    var g=x.createRadialGradient(gx,gy,0,gx,gy,r);
    g.addColorStop(0,'rgba(76,170,255,0.10)');g.addColorStop(.2,'rgba(44,126,214,0.05)');
    g.addColorStop(.48,'rgba(24,82,146,0.018)');g.addColorStop(1,'rgba(24,82,146,0)');
    x.fillStyle=g;x.beginPath();x.arc(gx,gy,r,0,Math.PI*2);x.fill();}
  function bm(){var t=S.t,bs=S.w*0.64,cr=Math.cos(S.rot),sr=Math.sin(S.rot);
    var mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;S.mr=[];
    for(var j=0;j<S.rows;j++){var d=j/(S.rows-1),row=[];
      for(var i=0;i<S.cols;i++){var u=i/(S.cols-1),p=mp(u,d,t);
        var lx=p.x*bs,ly=p.y*bs,rx=lx*cr-ly*sr,ry=lx*sr+ly*cr;
        mnX=Math.min(mnX,rx);mxX=Math.max(mxX,rx);mnY=Math.min(mnY,ry);mxY=Math.max(mxY,ry);
        row.push({rx:rx,ry:ry,d:d});}S.mr.push(row);}
    return{tx:-mnX,ty:S.h-mxY};}
  var rafId=null;
  function rn(ts){if(!S.lt)S.lt=ts;var dt=Math.min((ts-S.lt)/1000,0.05);S.lt=ts;S.t+=dt;
    x.clearRect(0,0,S.w,S.h);
    if (window.innerWidth <= 768) {
      x.save();
      x.scale(-1, 1);
      x.translate(-S.w, 0);
    }
    ds();dg();var f=bm();
    for(var j=0;j<S.mr.length;j++){var row=S.mr[j],d=row[0].d,fw=1-Math.pow(d,0.72);
      var op=0.08+fw*0.42,rd=0.52+fw*0.72,gs=rd*4.4,ps=rd*2,off=j&1;
      x.globalAlpha=op*0.28;
      for(var i=off;i<row.length;i+=2){var p=row[i];x.drawImage(S.gs,p.rx+f.tx-gs/2,p.ry+f.ty-gs/2,gs,gs);}
      x.globalAlpha=op;
      for(var i=0;i<row.length;i++){var p=row[i];x.drawImage(S.ps,p.rx+f.tx-ps/2,p.ry+f.ty-ps/2,ps,ps);}}
    if (window.innerWidth <= 768) x.restore();
    rafId=requestAnimationFrame(rn);}
  function drawOnce(){S.lt=0;bm();var f=bm();x.clearRect(0,0,S.w,S.h);ds();dg();
    for(var j=0;j<S.mr.length;j++){var row=S.mr[j],d=row[0].d,fw=1-Math.pow(d,0.72);
      var op=0.08+fw*0.42,rd=0.52+fw*0.72,gs=rd*4.4,ps=rd*2,off=j&1;
      x.globalAlpha=op*0.28;
      for(var i=off;i<row.length;i+=2){var p=row[i];x.drawImage(S.gs,p.rx+f.tx-gs/2,p.ry+f.ty-gs/2,gs,gs);}
      x.globalAlpha=op;
      for(var i=0;i<row.length;i++){var p=row[i];x.drawImage(S.ps,p.rx+f.tx-ps/2,p.ry+f.ty-ps/2,ps,ps);}}}
  window.addEventListener('resize',function(){
    var nd=meshDims();S.rows=nd.rows;S.cols=nd.cols;rz();
    if(reducedMotion) drawOnce();
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=null;}}
    else if(!rafId && !reducedMotion){S.lt=0;rafId=requestAnimationFrame(rn);}
  });
  rz();
  if(reducedMotion) drawOnce(); else rafId=requestAnimationFrame(rn);
})();
</script>
</body>
</html>
