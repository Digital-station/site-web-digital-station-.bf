name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck · Lint · Test · Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Front-End Checklist › Security › "Audit dependencies for known
      # vulnerabilities". Fails only on high/critical findings.
      - run: npm audit --audit-level=high
