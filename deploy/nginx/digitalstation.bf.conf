# ============================================================================
#  Nginx Configuration for Digital Station (digitalstation.bf)
#  Place at /etc/nginx/sites-available/digitalstation.bf
#  Symlink to /etc/nginx/sites-enabled/digitalstation.bf
# ============================================================================

# Rate limiting zone for leads submission endpoint
limit_req_zone $binary_remote_addr zone=leads_limit:10m rate=5r/m;

# HTTP — Redirect all requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name digitalstation.bf www.digitalstation.bf;

    # ACME-challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://digitalstation.bf$request_uri;
    }
}

# HTTPS — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digitalstation.bf;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/digitalstation.bf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitalstation.bf/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/digitalstation.bf/chain.pem;

    # TLS Protocols & Ciphers (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Next.js Static Assets (Hashed, Immutable 1 Year Cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Brand & Image Assets (1 Day Cache with SWR)
    location ~* ^/(brand|logo|process|team|placeholders|docs)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # API Leads Endpoint with Rate Limiting
    location /api/leads {
        limit_req zone=leads_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

# Redirect www to apex domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.digitalstation.bf;

    ssl_certificate /etc/letsencrypt/live/digitalstation.bf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitalstation.bf/privkey.pem;

    return 301 https://digitalstation.bf$request_uri;
}
